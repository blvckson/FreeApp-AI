name: Validate Phone-Hosted Server

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/index.html'
      - 'public/server-panel.js'
      - '.github/workflows/phone-server-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeApp-AI-phone-server-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

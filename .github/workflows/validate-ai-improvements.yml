name: Validate FreeApp AI Improvements

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - qwen-parity-improvements
      - remove-cloudflare-owner-self-modification
      - fix/fast-replies-and-backend-removal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check chat JavaScript syntax
        run: node --check public/app.js
      - name: Check voice app JavaScript syntax
        run: node --check public/voice/app.js

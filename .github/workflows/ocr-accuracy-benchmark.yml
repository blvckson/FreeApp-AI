name: OCR Accuracy Benchmark

on:
  workflow_run:
    workflows: ["Deploy FreeApp AI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  ocr-benchmark:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          npm install --no-save tesseract.js@5.1.1
      - name: Generate synthetic document fixtures
        run: |
          python <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageOps, ImageEnhance
          from pathlib import Path

          out = Path("ocr-fixtures")
          out.mkdir(exist_ok=True)
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 58)
          lines = ["INVOICE NO: QX-48291", "CUSTOMER: MARA KATO", "TOTAL DUE: UGX 184,750"]

          def base(fill=(20,20,20), blur=0):
              image = Image.new("RGB", (1500, 460), "white")
              draw = ImageDraw.Draw(image)
              for index, line in enumerate(lines):
                  draw.text((70, 45 + index * 130), line, font=font, fill=fill)
              return image.filter(ImageFilter.GaussianBlur(blur)) if blur else image

          def enhance(image):
              gray = ImageOps.grayscale(image)
              gray = ImageEnhance.Contrast(gray).enhance(1.65)
              gray = gray.resize((gray.width * 2, gray.height * 2), Image.Resampling.LANCZOS)
              return gray.convert("RGB")

          clear = base()
          clear.save(out / "clear.png")

          faint = base(fill=(175,175,175), blur=0.5)
          faint.save(out / "faint.png")
          enhance(faint).save(out / "faint-enhanced.png")

          rotated = clear.rotate(90, expand=True)
          rotated.save(out / "rotated.png")
          rotated.rotate(-90, expand=True).save(out / "rotated-candidate-90.png")
          rotated.rotate(90, expand=True).save(out / "rotated-candidate-270.png")

          blurred = base(blur=1.6)
          blurred.save(out / "blurred.png")
          enhance(blurred).filter(ImageFilter.UnsharpMask(radius=2, percent=180, threshold=3)).save(out / "blurred-enhanced.png")
          PY
      - name: Run local OCR accuracy benchmark
        run: node scripts/ocr-benchmark.cjs
      - name: Upload OCR benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeApp-AI-OCR-benchmark
          path: ocr-benchmark-results/local-ocr.json
          if-no-files-found: warn
          retention-days: 30

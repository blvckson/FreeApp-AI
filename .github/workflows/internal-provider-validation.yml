name: Internal Model Provider Validation

on:
  pull_request:
    paths:
      - "worker.js"
      - "provider/**"
      - ".github/workflows/internal-provider-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Run existing regression tests
        run: npm test
      - name: Validate model profile and deployment files
        run: |
          node -e 'const p=require("./provider/model-profile.json"); if(!p.upstream_model || !p.artifact_url.startsWith("https://") || !/^[a-f0-9]{64}$/i.test(p.sha256) || p.readiness !== "baseline-configured-not-yet-deployed-or-benchmarked") process.exit(1); console.log("Model profile metadata valid:", p.upstream_model);'
          test -s provider/docker-compose.yml
          test -s provider/README.md
          test -s provider/download-model.sh
          test -s provider/smoke-test.sh
          sh -n provider/download-model.sh
          sh -n provider/smoke-test.sh

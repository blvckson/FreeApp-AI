services:
  freeapp-model:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: freeapp-ai-model
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/models:ro
    environment:
      LLAMA_ARG_MODEL: /models/model.gguf
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_CTX_SIZE: "8192"
      LLAMA_API_KEY: ${LLAMA_API_KEY:?Set LLAMA_API_KEY in provider/.env}
    command: ["--model", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "8192", "--api-key", "${LLAMA_API_KEY}"]
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
